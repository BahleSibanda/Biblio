<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblio — Home</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
Z
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" aria-label="Main navigation">
      <div class="logo">
        <div class="logo-icon">📚</div>
      </div>

      <nav class="side-icons">
        <button class="icon-btn active" aria-label="Home" onclick="location.href='index.html'">🏠</button>
        <button class="icon-btn" aria-label="Discover" onclick="location.href='discover.html'">🔍</button>
        <button class="icon-btn" aria-label="Bookclubs" onclick="location.href='bookclubs.html'">📖</button>

        <!-- NOTIFICATIONS placeholder -->
        <button class="icon-btn" aria-label="Notifications" disabled>🔔</button>

        <!-- DYNAMIC PROFILE BUTTON -->
        <button id="profile-btn" class="icon-btn" aria-label="Profile">👤</button>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <header class="top-nav">
        <div class="nav-left">
          <h1 class="brand">Biblio</h1>

          <nav class="top-links" aria-label="Primary">
            <a href="index.html" class="pill active">Home</a>
            <a href="discover.html" class="pill">Discover</a>
            <a href="bookclubs.html" class="pill">Bookclubs</a>
            <a id="profile-link" class="pill">Profile</a>
          </nav>
        </div>

        <div class="nav-right">
          <input id="search-input" class="search" placeholder="Search books or authors">
        </div>
      </header>

      <!-- HOTTEST BOOKS -->
      <section class="card hottest">
        <h2>Hottest Books</h2>
        <div id="hottest-books" class="discover-results"></div>
      </section>

      <!-- DASHBOARD -->
      <section class="dashboard">
        <div class="content-left">
          <section class="section card">
            <h2 class="section-title">Latest from Friends</h2>
            <div class="carousel" id="friends-row"></div>
          </section>
        </div>

        <aside class="right-panel card">
          <h3 class="muted">Currently Reading</h3>
          <div id="current-reading" class="currently-reading"></div>
        </aside>
      </section>

      <footer class="app-footer">© Biblio — Built with warmth</footer>

    </main>
  </div>

  <script>
    // ✅ Handle Profile Button (Substack-style)
    const profileBtn = document.getElementById("profile-btn");
    const profileLink = document.getElementById("profile-link");
    const user = JSON.parse(localStorage.getItem("currentUser"));

    if (!user) {
      profileBtn.onclick = () => location.href = "signin.html";
      profileLink.textContent = "Sign In";
      profileLink.href = "signin.html";
    } else {
      profileBtn.onclick = () => location.href = "profile.html";
      profileLink.textContent = "Profile";
      profileLink.href = "profile.html";
    }
  </script>

  <script defer src="script.js"></script>
</body>
</html>
