<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblio - Connect through stories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Serif+Pro:wght@400;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="logo">
            <i class="fas fa-book-open"></i>
            <span>Biblio</span>
        </div>
        <div class="nav-links">
            <a href="#" class="active" data-page="home">HOME</a>
            <a href="#" data-page="bookclubs">BOOKCLUBS</a>
            <a href="#" data-page="following">FOLLOWING</a>
        </div>
        <div class="user-actions">
            <button id="login-btn">LOG IN</button>
            <button id="signup-btn">SIGN UP</button>
        </div>
    </nav>

    <!-- Side Icon Menu -->
    <div class="side-menu">
        <a href="#" data-page="home" title="Home">
            <i class="fas fa-home"></i>
        </a>
        <a href="#" id="search-modal-btn" title="Search">
            <i class="fas fa-search"></i>
        </a>
        <a href="#" data-page="notifications" title="Notifications">
            <i class="fas fa-bell"></i>
            <span class="notification-badge">3</span>
        </a>
        <a href="#" data-page="profile" title="Profile">
            <i class="fas fa-user"></i>
        </a>
        <a href="#" data-page="settings" title="Settings">
            <i class="fas fa-cog"></i>
        </a>
    </div>

    <!-- Main Content Container -->
    <div class="container">
        <!-- Home Page Content (now directly in index.html) -->
        <div id="home-page" class="page active">
            <div class="content-box">
                <h2 class="section-title">Hottest Reads</h2>
                <div class="book-grid" id="hottest-reads">
                    <!-- Books will be populated by JavaScript -->
                </div>
            </div>
            <div class="content-box">
                <h2 class="section-title">What Your Friends Are Reading</h2>
                <div class="book-grid" id="friends-reading">
                    <!-- Books will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Other pages will be loaded dynamically here -->
        <div id="page-content">
            <!-- Other pages load here when navigated to -->
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Log In</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-username">Username or Email</label>
                    <input type="text" id="login-username" class="form-input" required>
                    <div class="error-message" id="login-username-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-input" required>
                    <div class="error-message" id="login-password-error"></div>
                </div>
                <button type="submit" class="cta">Log In</button>
                <div class="success-message" id="login-success"></div>
            </form>
        </div>
    </div>

    <div class="modal" id="signup-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Sign Up</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label" for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" class="form-input" required>
                    <div class="error-message" id="signup-name-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-username">Username</label>
                    <input type="text" id="signup-username" class="form-input" required>
                    <div class="error-message" id="signup-username-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-email">Email</label>
                    <input type="email" id="signup-email" class="form-input" required>
                    <div class="error-message" id="signup-email-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-password">Password</label>
                    <input type="password" id="signup-password" class="form-input" required>
                    <div class="error-message" id="signup-password-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" class="form-input" required>
                    <div class="error-message" id="signup-confirm-error"></div>
                </div>
                <button type="submit" class="cta">Create Account</button>
                <div class="success-message" id="signup-success"></div>
            </form>
        </div>
    </div>

    <!-- Search Modal -->
    <div class="modal" id="search-modal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3 class="modal-title">Search Books</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="form-group">
                <input type="text" id="search-modal-input" class="form-input" placeholder="Search for books, authors, or genres...">
                <div class="error-message" id="search-modal-error"></div>
            </div>
            <div class="book-grid" id="search-modal-results" style="max-height: 400px; overflow-y: auto;">
                <!-- Search results will be populated by JavaScript -->
            </div>
        </div>
    </div>

   <div id="book-modal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 id="book-modal-title">Book Details</h2>
        <div id="book-modal-content">
            <!-- Book details will be dynamically inserted here by JavaScript -->
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="js/search.js"></script>
<script src="js/home.js"></script> <!-- Keep this for future use -->

</body>
</html>
