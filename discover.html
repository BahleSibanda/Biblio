<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblio — Discover</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script defer src="script.js"></script>
</head>

<body>
  <div class="app">
    <main class="main-content">

      <header class="top-nav">
        <h1 class="brand">Biblio</h1>
        <div class="nav-right">
          <input id="search-input" placeholder="Search for books..." class="search">
          <button id="search-btn" class="btn">Search</button>
        </div>
      </header>

      <section class="discover card">
        <h2>Newest Books</h2>
        <div id="newest-books" class="discover-results"></div>
      </section>

      <section class="discover card">
        <h2>Search Results</h2>
        <div id="search-results" class="discover-results"></div>
      </section>

    </main>
  </div>
</body>
</html>
