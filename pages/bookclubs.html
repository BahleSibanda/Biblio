
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblio – Bookclubs</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Global Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/page.css">
  <link rel="stylesheet" href="css/animations.css">

</head>

<body>
  <!-- TOP NAVIGATION -->
  <nav class="top-nav">
    <div class="logo">
      <i class="fas fa-book-open"></i>
      <span>Biblio</span>
    </div>

    <div class="nav-links">
      <a href="../index.html" data-page="home">HOME</a>
      <a href="#" class="active" data-page="bookclubs">BOOKCLUBS</a>
      <a href="#" class="requires-login" data-page="following">FOLLOWING</a>
    </div>

    <div class="user-actions">
      <button id="open-login-modal" class="cta">LOG IN</button>
      <button id="open-signup-modal" class="cta">SIGN UP</button>
    </div>
  </nav>

  <!-- SEARCH BAR -->
  <div class="search-bar container" style="margin-top:1.5rem; text-align:center;">
    <input type="text" id="club-search" placeholder="Search for a book club..." style="width:80%; max-width:500px; padding:0.7rem; border:1px solid #ccc; border-radius:8px; font-size:1rem;">
  </div>

  <!-- MAIN CONTENT -->
  <div class="bookclubs-page container">

  <div class="bookclub-search-container" style="text-align:center; margin:1rem auto;">
    <input 
    type="text" 
    id="bookclub-search-input" 
    placeholder="Search for book clubs..." 
    style="width:80%;max-width:400px;padding:0.5rem;border-radius:8px;border:1px solid #ccc;"
    />
  </div>

    <!-- YOUR BOOK CLUBS -->
    <div class="section-header">
      <h2 class="section-title">Your Book Clubs</h2>
      <a href="#" class="see-all" data-section="your-bookclubs">See All</a>
    </div>
    <div class="bookclubs-grid" id="your-bookclubs">
      <p style="color: var(--dark-grey); font-size: 0.95rem;">You haven’t joined any clubs yet. Join one below!</p>
    </div>

    <!-- POPULAR BOOK CLUBS -->
    <div class="section-header" style="margin-top: 3rem;">
      <h2 class="section-title">Popular Book Clubs</h2>
      <a href="#" class="see-all" data-section="popular-bookclubs">See All</a>
    </div>
    <div class="bookclubs-grid" id="popular-bookclubs"></div>

    <!-- SUGGESTED BOOK CLUBS -->
    <div class="section-header" style="margin-top: 3rem;">
      <h2 class="section-title">Suggested Book Clubs</h2>
      <a href="#" class="see-all" data-section="suggested-bookclubs">See All</a>
    </div>
    <div class="bookclubs-grid" id="suggested-bookclubs"></div>
  </div>

  <!-- AUTH MODAL -->
  <div class="auth-modal" id="auth-modal" aria-hidden="true">
    <div class="auth-modal-content">
      <button class="close-auth-modal">&times;</button>
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active">Log In</button>
        <button id="tab-signup" class="auth-tab">Sign Up</button>
      </div>
      <form id="login-form" class="auth-form">
        <h3>Welcome back</h3>
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="auth-submit">Log In</button>
      </form>
      <form id="signup-form" class="auth-form hidden">
        <h3>Create an account</h3>
        <input type="text" id="signup-name" placeholder="Full Name" required>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <button type="submit" class="auth-submit">Sign Up</button>
      </form>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="js/gsap-anim.js"></script>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
 <script src="../js/bookclubs.js" defer></script>
 <script src="../js/auth.js" defer></script>

</body>
</html>
